<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinical OS Admin — Settings</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="layout">
    <aside data-nav="settings"></aside>
    <main>
      <div class="bar"><h2>Settings</h2></div>
      <form class="form">
        <label>Org name <input value="Clinical OS BD" /></label>
        <label>Default pad language
          <select><option>en</option><option>bn</option></select>
        </label>
        <label>Default paper
          <select><option>a5</option><option>a4</option></select>
        </label>
        <label>SMS gateway key <input type="password" placeholder="••••••••" /></label>
        <label>WhatsApp BSP token <input type="password" placeholder="••••••••" /></label>
        <label>Pad accent color <input type="color" value="#0b5f4b" /></label>
        <button type="button">Save</button>
      </form>
    </main>
  </div>
  <script src="nav.js"></script>
</body>
</html>
