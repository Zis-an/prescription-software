services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicalos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicalos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-clinicalos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicalos} -d ${POSTGRES_DB:-clinicalos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinicalos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clinicalos-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicalos}:${POSTGRES_PASSWORD:-clinicalos_dev}@postgres:5432/${POSTGRES_DB:-clinicalos}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      # DGDA formulary for first-boot seed (optional; seed falls back to samples)
      - ./app-templates/frontend/clinical-os-doctor/data/dgda-drugs.js:/app/app-templates/frontend/clinical-os-doctor/data/dgda-drugs.js:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: clinicalos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
