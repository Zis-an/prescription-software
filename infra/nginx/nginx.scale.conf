worker_processes auto;

events {
  worker_connections 4096;
}

http {
  upstream clinicalos_api {
    least_conn;
    server api1:3001 max_fails=3 fail_timeout=30s;
    server api2:3001 max_fails=3 fail_timeout=30s;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;

  server {
    listen 80;

    location /health {
      proxy_pass http://clinicalos_api/health;
    }

    location /ready {
      proxy_pass http://clinicalos_api/ready;
    }

    location / {
      limit_req zone=api_limit burst=100 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_pass http://clinicalos_api;
    }
  }
}
