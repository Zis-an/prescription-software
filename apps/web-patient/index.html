<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinical OS — My Prescription</title>
    <style>
      :root { --accent:#0b5f4b; --bg:#f3f7f5; }
      body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:#0f1c18; }
      main { max-width:640px; margin:0 auto; padding:24px 16px; }
      .card { background:#fff; border:1px solid #d7e2dd; border-radius:14px; padding:18px; }
      h1 { color:var(--accent); font-size:1.35rem; margin:0 0 8px; }
      label { display:grid; gap:6px; margin:12px 0; }
      input { padding:10px; border:1px solid #c9d5cf; border-radius:8px; font:inherit; }
      button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; }
      .muted { color:#5a6b64; }
      .med { border-top:1px solid #e6eeea; padding:10px 0; }
      .error { color:#b42318; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Clinical OS</h1>
        <p class="muted">Patient prescription view — no app install required.</p>
        <form id="form">
          <label>Share token
            <input name="token" value="demo-share-karim" required />
          </label>
          <button type="submit">Open prescription</button>
        </form>
        <p id="err" class="error" hidden></p>
      </div>
      <div id="rx" class="card" hidden style="margin-top:14px"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
