<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinical OS — Admin</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-wrap">
      <form id="login-form" class="login-card">
        <h1>Clinical OS Admin</h1>
        <p class="muted">SUPER_ADMIN / ADMIN panel</p>
        <label>Email <input name="email" type="email" value="superadmin@clinicalos.local" required /></label>
        <label>Password <input name="password" type="password" value="SuperAdmin123!" required /></label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app-view" class="layout" hidden>
      <aside>
        <div class="brand">Clinical OS</div>
        <div id="whoami" class="muted small"></div>
        <nav>
          <button type="button" data-view="dashboard" class="nav active">Dashboard</button>
          <button type="button" data-view="users" class="nav">Users</button>
          <button type="button" data-view="chambers" class="nav">Chambers</button>
          <button type="button" data-view="medicines" class="nav">Drug KB / Ranking</button>
          <button type="button" data-view="audit" class="nav">Audit</button>
        </nav>
        <button type="button" id="logout" class="ghost">Log out</button>
      </aside>
      <main>
        <section id="view-dashboard" class="view"></section>
        <section id="view-users" class="view" hidden></section>
        <section id="view-chambers" class="view" hidden></section>
        <section id="view-medicines" class="view" hidden></section>
        <section id="view-audit" class="view" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
