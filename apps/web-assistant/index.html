<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinical OS — Assistant</title>
    <style>
      :root { --accent:#0b5f4b; --bg:#e8efeb; --muted:#5a6b64; }
      body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:#0f1c18; }
      header { background:linear-gradient(90deg,#0d3f34,#0a2f27); color:#dff7ee; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
      main { padding:20px; max-width:960px; margin:0 auto; }
      .card { background:#fff; border:1px solid #d7e2dd; border-radius:12px; padding:16px; margin-top:14px; }
      label { display:grid; gap:6px; font-size:.9rem; margin-bottom:10px; }
      input, select { padding:8px 10px; border:1px solid #c9d5cf; border-radius:8px; font:inherit; }
      button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
      table { width:100%; border-collapse:collapse; margin-top:10px; }
      th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #e6eeea; font-size:.92rem; }
      .muted { color:var(--muted); }
      .error { color:#b42318; }
      .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
      .row label { flex:1; min-width:140px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>Clinical OS · Assistant</strong>
        <div class="muted" style="color:#b7e8d6;font-size:.85rem">Queue · serial · vitals · fees — no full chart</div>
      </div>
      <div id="who"></div>
    </header>
    <main>
      <div id="login" class="card">
        <h2>Sign in</h2>
        <form id="login-form">
          <label>Email <input name="email" value="assistant@clinicalos.local" /></label>
          <label>Password <input name="password" type="password" value="Assistant123!" /></label>
          <button type="submit">Enter chamber desk</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
      <div id="desk" hidden>
        <div class="card">
          <div class="row">
            <label>Chamber
              <select id="chamber"></select>
            </label>
            <button type="button" id="refresh">Refresh queue</button>
          </div>
        </div>
        <div class="card">
          <h3>Add to queue</h3>
          <form id="add-form" class="row">
            <label>Patient search <input id="pq" placeholder="Name or phone" /></label>
            <label>Patient
              <select id="patient" required></select>
            </label>
            <label>Fee (BDT) <input name="feeBdt" type="number" value="800" /></label>
            <label>BP <input name="bp" placeholder="120/80" /></label>
            <label>Pulse <input name="pulse" placeholder="78" /></label>
            <button type="submit">Assign serial</button>
          </form>
          <p class="muted">Clinical notes / diagnosis / full Rx history are hidden in this panel (RBAC).</p>
        </div>
        <div class="card">
          <h3>Today’s queue</h3>
          <table>
            <thead><tr><th>#</th><th>Patient</th><th>Phone</th><th>Fee</th><th>Status</th><th></th></tr></thead>
            <tbody id="queue-body"></tbody>
          </table>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
