<article class="sheet a5" data-template="pediatric">
  <header class="pad-header">
    <div>
      <h1 class="chamber-name" data-text="chamber.name"></h1>
      <div class="chamber-meta">
        <div data-text="chamber.address"></div>
        <div data-text="chamber.phone"></div>
      </div>
    </div>
    <div class="prescriber-block">
      <p class="prescriber-name" data-text="prescriber.name"></p>
      <div class="prescriber-meta" data-text="prescriber.qualification"></div>
      <div class="bmdc"><span data-label="bmdc"></span>: <span data-text="prescriber.bmdc"></span></div>
    </div>
  </header>

  <div class="meta-row">
    <div><span class="rx-badge" data-label="rx_symbol"></span></div>
    <div><span class="label" data-label="date"></span><span class="value" data-text="rx.authoredOn"></span></div>
    <div><span class="variant-pill">Pediatric</span></div>
    <div><span class="label" data-label="version"></span> v<span class="value" data-text="rx.version"></span></div>
  </div>

  <section class="patient-box weight-emphasis">
    <div>
      <span class="label" data-label="name"></span>
      <span class="value" data-text="patient.name"></span>
    </div>
    <div>
      <span class="label" data-label="age"></span>
      <span class="value"><span data-text="patient.ageYears"></span> <span data-label="years"></span></span>
    </div>
    <div>
      <span class="label" data-label="sex"></span>
      <span class="value" data-text="patient.sex"></span>
    </div>
    <div>
      <span class="label" data-label="weight"></span>
      <span class="value"><span data-text="patient.weightKg"></span> <span data-label="kg"></span></span>
    </div>
    <div class="allergy" style="grid-column: 1 / -1">
      <span class="label" data-label="allergies"></span>
      <span class="value" data-text="patient.allergies"></span>
    </div>
  </section>

  <section class="clinical-box">
    <div class="section-title" data-label="diagnosis"></div>
    <div data-text="rx.diagnosis"></div>
  </section>

  <section class="meds-box">
    <div class="section-title" data-label="medications"></div>
    <table class="meds">
      <thead>
        <tr><th>#</th><th data-label="medications"></th><th data-label="quantity"></th></tr>
      </thead>
      <tbody data-meds></tbody>
    </table>
  </section>

  <section class="advice-box">
    <div class="section-title" data-label="advice"></div>
    <div data-advice></div>
    <div style="margin-top:6px"><span class="label" data-label="follow_up"></span> <span class="value" data-text="rx.followUpDate"></span></div>
  </section>

  <footer class="footer-grid">
    <div class="small muted" data-text="rx.id"></div>
    <div class="sign-line"><div data-label="signature"></div><div class="small" data-text="prescriber.name"></div></div>
    <div class="qr-box"><div data-qr></div><div data-label="verify"></div></div>
  </footer>
</article>
