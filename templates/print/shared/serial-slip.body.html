<article class="sheet a5 serial-slip" data-template="serial_slip">
  <h1 class="chamber-name" data-text="chamber.name"></h1>
  <div class="muted" data-label="serial_slip"></div>
  <div class="big-serial" data-text="visit.serial">0</div>
  <div class="value" data-text="patient.name"></div>
  <div class="muted" style="margin-top:8px">
    <span data-label="date"></span>: <span data-text="rx.authoredOn"></span>
  </div>
  <div class="muted">
    <span data-label="fee"></span>: <span data-text="visit.fee"></span>
  </div>
  <div class="small muted" style="margin-top:16px" data-text="prescriber.name"></div>
</article>
